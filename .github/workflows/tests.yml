name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
        pandas_major: ["2", "3"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies (pandas 2.x)
        if: matrix.pandas_major == '2'
        run: python -m pip install -r requirements.txt 'pandas>=2.2,<3'
      - name: Install dependencies (pandas 3.x)
        if: matrix.pandas_major == '3'
        run: python -m pip install -r requirements.txt 'pandas>=3,<4'
      - name: Compile application and tests
        run: python -m compileall -q app.py ran_monitor_ai tests scripts
      - name: Run unit and Streamlit workflow tests
        run: python -m unittest discover -s tests -v
